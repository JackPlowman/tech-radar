name: "Setup Tests Dependencies"
description: "Installs tests dependencies for the project"

inputs:
  setup-browsers:
    description: "Whether to set up browsers for Playwright"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up Just
      uses: extractions/setup-just@v4.0.0 # zizmor: ignore[unpinned-uses] Verified by the workflow lockfile.
      with:
        just-version: "1.59.0"
    - name: Install Python and UV
      uses: astral-sh/setup-uv@v10.3.3 # zizmor: ignore[unpinned-uses] Verified by the workflow lockfile.
      with:
        working-directory: tests
    - name: Install Playwright Dependencies
      if: ${{ inputs.setup-browsers == 'true' }}
      shell: bash
      run: just tests::playwright-install
    - name: Install Python Dependencies
      shell: bash
      run: just tests::install
