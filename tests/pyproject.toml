[project]
name = "tests"
dynamic = ["version"]
requires-python = "~=3.14.0"
dependencies = [
  "check-jsonschema==0.39.0",
  "playwright==1.65.2",
  "pytest-playwright==0.10.0",
  "pytest-rerunfailures==16.7",
  "pytest==9.2.0",
  "ruff==0.17.5",
  "ty==0.0.104",
  "vulture==2.16",
]

[tool.uv]
required-version = "~=0.13.0"
package = false
override-dependencies = ["urllib3==2.8.0"]

[tool.setuptools]
py-modules = ["ui", "schema_validation"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
extend-select = ["E501"]
select = ["ALL"]

ignore = [
  "COM812",  # Ignore due to conflict with Ruff formatter
  "CPY001",  # This project uses a repository-level licence
  "ISC001",  # Ignore due to conflict with Ruff formatter
  "PLR2004", # Ignore magic value
  "D104",    # Ignore missing docstring in public package
  "D100",    # Ignore missing docstring in public module
  "N999",    # Ignore invalid module name
  "SIM112",  # Ignore Lowercase environment variables (used for GitHub actions)
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"**test_*.py" = ["S101", "D102", "D103", "SLF001", "PT019"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.vulture]
ignore_names = []
